name: Publish

concurrency:
  group: publish
  cancel-in-progress: true

# VS - start
# VS - vs-2f8.1: explicit trigger policy.
# VS -
# VS - We are intentionally workflow_dispatch-only (no push-to-main trigger,
# VS - no schedule) until H2 — the first end-to-end test of the publish
# VS - pipeline against our self-hosted Robust.Cdn — passes. Reasoning:
# VS -   1. PUBLISH_TOKEN must be minted on the live CDN and registered as
# VS -      a GH Actions secret first (H1, human work). Until then any push
# VS -      trigger would 401-storm the workflow run history.
# VS -   2. We want manual gate-keeping on the very first publish so we can
# VS -      verify CI -> CDN manifest -> watchdog Manifest fetch -> launcher
# VS -      delta download in a controlled run before automating it.
# VS -   3. Once H2 is signed off (vs-2f8.1 acceptance), flip this to
# VS -      `push: branches: [main]` + keep workflow_dispatch.
# VS -
# VS - The `schedule` block is left commented for the same reason. Upstream
# VS - SS14 ran this daily; we'll evaluate cadence after launch.
# VS - end
on:
  workflow_dispatch:
  # schedule:
  # - cron: '0 10 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # VS - guard scoped to space-wizards's repo by `github.repository ==`,
    # VS - so it's a no-op on azigler/vacation-station-14 (we use `main`,
    # VS - not `master`). Left in place so an upstream-sw re-checkout of
    # VS - this file stays a clean diff-of-comment-only.
    - name: Fail if we are attempting to run on the master branch
      if: ${{GITHUB.REF_NAME == 'master' && github.repository == 'space-wizards/space-station-14'}}
      run: exit 1

    - name: Install dependencies
      run: sudo apt-get install -y python3-paramiko python3-lxml

    - uses: actions/checkout@v4.2.2
      with:
        submodules: 'recursive'
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform win-x64 --platform win-arm64 --platform linux-x64 --platform linux-arm64 --platform osx-x64 --platform osx-arm64

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Publish version
      run: Tools/publish_multi_request.py
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}

    - name: Publish changelog (Discord)
      continue-on-error: true
      run: Tools/actions_changelogs_since_last_run.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}

    - name: Publish changelog (RSS)
      continue-on-error: true
      run: Tools/actions_changelog_rss.py
      env:
        CHANGELOG_RSS_KEY: ${{ secrets.CHANGELOG_RSS_KEY }}
