name: Publish Testing

concurrency:
  group: publish-testing
  cancel-in-progress: true

# VS - start
# VS - 2026-05-16: cron DISABLED again. The vs-2f8.1 re-enable was premature —
# VS - PUBLISH_TOKEN (vs-2f8.10) is still unminted, so the nightly run has
# VS - been auth-failing every day. Workflow_dispatch stays available for
# VS - manual smoke-testing. Re-enable the cron block below as part of
# VS - vs-2f8.11 (end-to-end CDN publish test) — that bead owns the
# VS - verification gate before scheduled publishing resumes.
# VS - end
on:
  workflow_dispatch:
  # VS - schedule disabled pending vs-2f8.10 (token mint) + vs-2f8.11 (e2e verify).
  # schedule:
  #   - cron: '0 10 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3.6.0
      with:
        submodules: 'recursive'
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v3.2.0
      with:
        dotnet-version: 10.0.x

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform win-x64 --platform win-arm64 --platform linux-x64 --platform linux-arm64 --platform osx-x64 --platform osx-arm64

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Publish version
      # VS - dropped --fork-id wizards-testing; default FORK_ID in the script
      # VS - is now "vacation-station" (vs-2f8.1). We don't run a separate
      # VS - testing fork — staging happens via workflow_dispatch + manual
      # VS - watchdog inspection before promotion.
      run: Tools/publish_multi_request.py
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}
