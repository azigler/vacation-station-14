name: Publish Testing

concurrency:
  group: publish-testing
  cancel-in-progress: true

# VS - start
# VS - vs-2f8.1: cron re-enabled now that we publish to our own self-hosted
# VS - Robust.Cdn (https://ss14.zig.computer/cdn/, fork-id "vacation-station").
# VS - Andrew's 2026-04-16 :wrench: commit (aae75db752) disabled this as a
# VS - stepping-stone — H2 (end-to-end test) gates re-enabling it in CI. Until
# VS - PUBLISH_TOKEN is minted (H1) and the manual workflow_dispatch run is
# VS - verified end-to-end, scheduled runs would only emit auth failures.
# VS - end
on:
  workflow_dispatch:
  schedule:
    # VS - cron re-enabled per vs-2f8.1; daily 10:00 UTC matches upstream cadence.
    - cron: '0 10 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3.6.0
      with:
        submodules: 'recursive'
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v3.2.0
      with:
        dotnet-version: 10.0.x

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform win-x64 --platform win-arm64 --platform linux-x64 --platform linux-arm64 --platform osx-x64 --platform osx-arm64

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Publish version
      # VS - dropped --fork-id wizards-testing; default FORK_ID in the script
      # VS - is now "vacation-station" (vs-2f8.1). We don't run a separate
      # VS - testing fork — staging happens via workflow_dispatch + manual
      # VS - watchdog inspection before promotion.
      run: Tools/publish_multi_request.py
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}
