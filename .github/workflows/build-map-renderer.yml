name: Build & Test Map Renderer

on:
  # VS - dev-cost discipline: no per-commit builds during pre-launch.
  # Nightly cron + manual dispatch + PR builds give enough signal
  # without burning Actions minutes on every push. See vs-kmz.
  schedule:
    - cron: '45 6 * * *'   # 06:45 UTC nightly
  workflow_dispatch:
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ main, master, staging, stable ]

jobs:
  build:
    if: github.actor != 'PJBot' && github.event.pull_request.draft == false
    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Master
        uses: actions/checkout@v4.2.2

      - name: Configure git to use HTTPS for submodules
        # VS - some recursively-pulled SS14 submodules (e.g. external/mapserver/
        # SS14.GithubApiHelper) declare git@github.com: SSH URLs that the
        # runner can't authenticate. Rewrite to HTTPS at git-config level.
        run: |
          git config --global url.https://github.com/.insteadOf git@github.com:

      - name: Setup Submodule
        run: |
          git submodule update --init --recursive

      - name: Pull engine updates
        uses: space-wizards/submodule-dependency@v0.1.5

      - name: Update Engine Submodules
        run: |
          cd RobustToolbox/
          git submodule update --init --recursive

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore

      - name: Build Project
        run: dotnet build Content.MapRenderer --configuration Release --no-restore /m

      - name: Run Map Renderer
        run: dotnet run --project Content.MapRenderer Dev

  ci-success:
    name: Build & Test Debug
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: exit 0
