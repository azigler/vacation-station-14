name: Test Packaging

on:
  # VS - dev-cost discipline: no per-commit builds during pre-launch.
  # Nightly cron + manual dispatch + PR builds give enough signal
  # without burning Actions minutes on every push. See vs-kmz.
  schedule:
    - cron: '30 6 * * *'   # 06:30 UTC nightly
  workflow_dispatch:
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ main, master, staging, stable ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.git**'
      - '**.yml'
      - 'RobustToolbox'
      - 'RobustToolbox/**'

jobs:
  build:
    name: Test Packaging
    if: github.actor != 'PJBot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Master
        uses: actions/checkout@v4.2.2

      - name: Configure git to use HTTPS for submodules
        # VS - some recursively-pulled SS14 submodules (e.g. external/mapserver/
        # SS14.GithubApiHelper) declare git@github.com: SSH URLs that the
        # runner can't authenticate. Rewrite to HTTPS at git-config level.
        run: |
          git config --global url.https://github.com/.insteadOf git@github.com:

      - name: Setup Submodule
        run: |
          git submodule update --init --recursive

      - name: Pull engine updates
        uses: space-wizards/submodule-dependency@v0.1.5

      - name: Update Engine Submodules
        run: |
          cd RobustToolbox/
          git submodule update --init --recursive

      # ubuntu-latest has .NET 10
      # - name: Setup .NET Core
      #   uses: actions/setup-dotnet@v4.1.0
      #   with:
      #     dotnet-version: 10.0.x

      - name: Install dependencies
        run: dotnet restore

      - name: Build Packaging
        run: dotnet build Content.Packaging --configuration Release --no-restore /m

      - name: Package server
        run: dotnet run --project Content.Packaging server --log-build --platform win-x64 --platform win-arm64 --platform linux-x64 --platform linux-arm64 --platform osx-x64 --platform osx-arm64

      - name: Package client
        run: dotnet run --project Content.Packaging client --log-build --no-wipe-release

      - uses: actions/upload-artifact@v4
        with:
          name: binlogs
          path: release/*.binlog
          retention-days: 7
