name: CRLF Check

on:
  # VS - dev-cost discipline: no per-commit builds during pre-launch.
  # Nightly cron + manual dispatch + PR builds give enough signal
  # without burning Actions minutes on every push. See vs-kmz.
  schedule:
    - cron: '20 6 * * *'   # 06:20 UTC nightly
  workflow_dispatch:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ main, master, staging, stable ]

jobs:
  build:
    name: CRLF Check
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.2.2
    - name: Check for CRLF
      run: Tools/check_crlf.py
