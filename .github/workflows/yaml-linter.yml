name: YAML Linter

on:
  # VS - dev-cost discipline: no per-commit builds during pre-launch.
  # Nightly cron + manual dispatch + PR builds give enough signal
  # without burning Actions minutes on every push. See vs-kmz.
  schedule:
    - cron: '15 6 * * *'   # 06:15 UTC nightly
  workflow_dispatch:
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ main, master, staging, stable ]

jobs:
  build:
    name: YAML Linter
    if: github.actor != 'PJBot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Configure git to use HTTPS for submodules
        # VS - some recursively-pulled SS14 submodules (e.g. external/mapserver/
        # SS14.GithubApiHelper) declare git@github.com: SSH URLs that the
        # runner can't authenticate. Rewrite to HTTPS at git-config level.
        run: |
          git config --global url.https://github.com/.insteadOf git@github.com:
      - name: Setup submodule
        run: |
          git submodule update --init --recursive
      - name: Pull engine updates
        uses: space-wizards/submodule-dependency@v0.1.5
      - name: Update Engine Submodules
        run: |
          cd RobustToolbox/
          git submodule update --init --recursive
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: 10.0.x
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore /p:WarningsAsErrors= /m
      - name: Run Linter
        run: dotnet run --project Content.YAMLLinter/Content.YAMLLinter.csproj --no-build
